name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository (pinned v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 26 LTS (pinned v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check assets, unit tests, types and Vite production build
        run: npm run validate
      - name: Install Chromium for browser verification
        # The Ubuntu mirror is occasionally slow (21 MB of fonts took >2 min and hit the old 150 s cap twice in a row):
        # allow 300 s per attempt and retry once. A real failure (missing package, no network) still fails the step.
        run: |
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=10s 300s npx playwright install --with-deps chromium; then exit 0; fi
            echo "Chromium install attempt $attempt failed" >&2
          done
          exit 1
      - name: Verify compiled site in Chromium
        run: npm run test:e2e
      - name: Upload only the compiled Vite dist directory
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: Deploy verified dist to Pages
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish Pages artifact (pinned v5.0.1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
