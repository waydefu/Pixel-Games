name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same pipeline CI runs (build and validate once, browser suites in parallel shards), plus the Pages artifact.
  verify-and-package:
    name: Verify and package site
    uses: ./.github/workflows/verify.yml
    with:
      pages: true

  deploy:
    name: Deploy verified dist to Pages
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish Pages artifact (pinned v5.0.1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
