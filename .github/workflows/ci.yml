name: Pixel-Games CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-games-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, typecheck, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout pinned v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node 26 LTS (pinned v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static, asset, unit, TypeScript, Vite and bundle checks
        run: npm run validate
      - name: Install Chromium browser with system dependencies
        run: timeout --signal=TERM --kill-after=10s 150s npx playwright install --with-deps chromium
      - name: Browser smoke test (desktop and mobile viewport)
        run: npm run test:e2e
