name: Pixel-Games CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-games-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks and Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout (pinned v5.0.1)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Node 24 (pinned setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Report environment
        run: node --version && npm --version
      - name: Run deterministic project checks
        run: npm run validate
