name: One-time CC0 ambientCG sand material import

# Temporary workflow: run once on the exact PR branch, then remove.
on:
  push:
    branches:
      - agent/a-coastal-surface-tree-materials-20261110
    paths:
      - .github/workflows/import-ambientcg-once.yml

permissions:
  contents: write

jobs:
  import_sand:
    name: Retrieve official Ground027 / Ground059 and commit compact PBR atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Pillow in isolated Python virtual environment
        run: |
          python3 -m venv .ambientcg-venv
          .ambientcg-venv/bin/pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download official CC0 source archives and pack two atlases
        run: .ambientcg-venv/bin/python scripts/assets/import_ambientcg_sand.py
      - name: Commit generated atlases and their SHA256 manifest entries to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manifest.json assets/materials/ambientcg-sand-albedo.webp assets/materials/ambientcg-sand-normal-roughness.png
          if git diff --cached --quiet; then echo "Already imported"; exit 0; fi
          git commit -m "assets(cc0): import optimized Ground027+Ground059 scanned beach PBR atlas"
          git push origin "HEAD:refs/heads/agent/a-coastal-surface-tree-materials-20261110"
